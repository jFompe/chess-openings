<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Opening Explorer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <section class="board-panel">
    <div class="board" id="board"></div>
  </section>

  <aside class="side-panel">

    <header class="side-header">
      <div class="header-row">
        <h1>Opening Explorer</h1>
        <span class="score-badge header-score eq" id="headerScore">0.0</span>
      </div>
      <div class="opening-name" id="openingName">Starting Position</div>
      <div class="eval-bar" aria-hidden="true">
        <div class="eval-fill" id="evalFill"></div>
      </div>
    </header>

    <div class="history" id="history"></div>

    <div class="moves-wrap">
      <div class="moves-head">
        <span>Possible moves</span>
        <span id="moveCount"></span>
      </div>
      <div class="moves" id="moves"></div>
    </div>

    <footer class="side-footer">
      <button id="backBtn">← Back</button>
      <button id="resetBtn">⟲ Reset</button>
    </footer>
  </aside>

</div>

<div class="preview" id="preview" aria-hidden="true">
  <div id="previewFrame"></div>
  <div class="preview-cap" id="previewCap"></div>
</div>

<!-- opening tree (defines ROOT) -->
<script src="moves.js"></script>
<!-- scores (attaches .score to every node in ROOT) -->
<script src="evals.js"></script>

<script>
"use strict";

/* =========================================================
   1. CHESS BOARD CORE
   Board = array of 64. Index 0 = a8, index 63 = h1.
   Uppercase = white, lowercase = black, null = empty.
   ========================================================= */

const FILES = "abcdefgh";
const GLYPH = { k:"♚", q:"♛", r:"♜", b:"♝", n:"♞", p:"♟" };

function initialBoard() {
  const b = new Array(64).fill(null);
  const back = ["r","n","b","q","k","b","n","r"];
  for (let i = 0; i < 8; i++) {
    b[i]      = back[i];               // rank 8 (black)
    b[8 + i]  = "p";                   // rank 7
    b[48 + i] = "P";                   // rank 2
    b[56 + i] = back[i].toUpperCase(); // rank 1 (white)
  }
  return b;
}

function sqIndex(sq) {
  return (8 - parseInt(sq[1], 10)) * 8 + FILES.indexOf(sq[0]);
}

/** Apply a UCI move (e2e4 / e7e8q / e1g1) — returns a NEW board. */
function applyUci(board, uci) {
  const b      = board.slice();
  const from   = sqIndex(uci.slice(0, 2));
  const to     = sqIndex(uci.slice(2, 4));
  const promo  = uci[4];
  const piece  = b[from];
  if (!piece) return b;

  const lower  = piece.toLowerCase();
  const isWhite = piece === piece.toUpperCase();

  b[to] = promo ? (isWhite ? promo.toUpperCase() : promo) : piece;
  b[from] = null;

  // Castling: king moves two files
  if (lower === "k" && Math.abs((to % 8) - (from % 8)) === 2) {
    const row = Math.floor(from / 8) * 8;
    if (to % 8 === 6) {            // kingside
      b[row + 5] = b[row + 7];
      b[row + 7] = null;
    } else {                       // queenside
      b[row + 3] = b[row + 0];
      b[row + 0] = null;
    }
  }

  if (lower === "p" && (from % 8) !== (to % 8) && !board[to]) {
    b[Math.floor(from / 8) * 8 + (to % 8)] = null;
  }

  return b;
}

/* =========================================================
   2. SCORE FORMATTING & EVAL BAR
   ========================================================= */

function formatScore(s) {
  if (s == null) return "–";
  if (typeof s === "object" && s.mate != null) {
    return s.mate > 0 ? "M" + s.mate : "-M" + Math.abs(s.mate);
  }
  const fixed = s.toFixed(1);
  if (fixed === "0.0" || fixed === "-0.0") return "0.0";
  return (s > 0 ? "+" : "") + fixed;
}

function scoreClass(s) {
  if (typeof s === "object" && s.mate != null) return s.mate > 0 ? "w" : "b";
  if (s >  0.04) return "w";
  if (s < -0.04) return "b";
  return "eq";
}

/** 0..1 → white's share of the eval bar. */
function whiteShare(s) {
  if (typeof s === "object" && s.mate != null) return s.mate > 0 ? 0.97 : 0.03;
  const v = (s == null) ? 0 : s;
  const p = 0.5 + 0.5 * Math.tanh(v / 2.5);
  return Math.min(0.97, Math.max(0.03, p));
}

/* =========================================================
   3. APP STATE
   ========================================================= */

const boardEl       = document.getElementById("board");
const movesEl       = document.getElementById("moves");
const historyEl     = document.getElementById("history");
const openingNameEl = document.getElementById("openingName");
const moveCountEl   = document.getElementById("moveCount");
const backBtn       = document.getElementById("backBtn");
const resetBtn      = document.getElementById("resetBtn");

const headerScoreEl = document.getElementById("headerScore");
const evalFillEl    = document.getElementById("evalFill");

const previewEl      = document.getElementById("preview");
const previewFrame   = document.getElementById("previewFrame");
const previewCap     = document.getElementById("previewCap");

/** Moves played from the root, e.g. [ {san,uci,next}, ... ] */
let path = [];

function currentNode() {
  let node = ROOT;
  for (const mv of path) node = mv.next;
  return node;
}

function currentBoard() {
  let b = initialBoard();
  for (const mv of path) b = applyUci(b, mv.uci);
  return b;
}

/* ---------- board rendering ---------- */
function renderBoard(board, lastMove) {
  const fromIdx = lastMove ? sqIndex(lastMove.uci.slice(0, 2)) : -1;
  const toIdx   = lastMove ? sqIndex(lastMove.uci.slice(2, 4)) : -1;

  const frag = document.createDocumentFragment();

  for (let i = 0; i < 64; i++) {
    const row = (i / 8) | 0;
    const col = i % 8;

    const sq = document.createElement("div");
    sq.className = "sq " + ((row + col) % 2 === 0 ? "light" : "dark");
    if (i === fromIdx) sq.classList.add("last");
    if (i === toIdx)   sq.classList.add("last", "dest");

    // coordinates
    if (col === 0) {
      const r = document.createElement("span");
      r.className = "coord rank";
      r.textContent = 8 - row;
      sq.appendChild(r);
    }
    if (row === 7) {
      const f = document.createElement("span");
      f.className = "coord file";
      f.textContent = FILES[col];
      sq.appendChild(f);
    }

    const p = board[i];
    if (p) {
      const el = document.createElement("span");
      const isWhite = p === p.toUpperCase();
      el.className = "piece " + (isWhite ? "w" : "b");
      el.textContent = GLYPH[p.toLowerCase()];
      sq.appendChild(el);
    }

    frag.appendChild(sq);
  }

  boardEl.replaceChildren(frag);
}

/* ---------- reusable mini board builder ---------- */
function buildMiniBoard(board, uci, extraClass) {
  const fromIdx = sqIndex(uci.slice(0, 2));
  const toIdx   = sqIndex(uci.slice(2, 4));

  const wrap = document.createElement("span");
  wrap.className = "mini-board" + (extraClass ? " " + extraClass : "");
  wrap.setAttribute("aria-hidden", "true");

  const frag = document.createDocumentFragment();

  for (let i = 0; i < 64; i++) {
    const row = (i / 8) | 0;
    const col = i % 8;

    const sq = document.createElement("span");
    sq.className = "msq " + ((row + col) % 2 === 0 ? "light" : "dark");
    if (i === fromIdx) sq.classList.add("last");
    if (i === toIdx)   sq.classList.add("last", "dest");

    const p = board[i];
    if (p) {
      const el = document.createElement("span");
      const isWhite = p === p.toUpperCase();
      el.className = "mpiece " + (isWhite ? "w" : "b");
      el.textContent = GLYPH[p.toLowerCase()];
      sq.appendChild(el);
    }

    frag.appendChild(sq);
  }

  wrap.appendChild(frag);
  return wrap;
}

/* =========================================================
   4. LARGE HOVER PREVIEW
   ========================================================= */

let previewToken = 0;

/** Size of the large board, kept reasonable for any viewport. */
function previewSize() {
  const byHeight = window.innerHeight * 0.46;
  const byWidth  = window.innerWidth  * 0.30;
  return Math.round(Math.min(380, Math.max(190, Math.min(byHeight, byWidth))));
}

function showPreview(anchorEl, board, mv) {
  const token = ++previewToken;
  const size  = previewSize();

  // 1) content
  const grid = buildMiniBoard(board, mv.uci, "preview-board");
  grid.style.setProperty("--mini", size + "px");
  previewFrame.replaceChildren(grid);

  previewCap.replaceChildren();
  const sanB = document.createElement("b");
  sanB.textContent = mv.san;

  const scoreChip = document.createElement("span");
  scoreChip.className = "preview-score " + scoreClass(mv.next.score);
  scoreChip.textContent = formatScore(mv.next.score);

  previewCap.append(
    sanB,
    document.createTextNode("  ·  " + mv.next.label + "  "),
    scoreChip
  );

  // 2) make it measurable but invisible
  previewEl.style.width   = (size + 22) + "px";
  previewEl.style.display = "block";
  previewEl.style.opacity = "0";

  // 3) position next to the card
  const r  = anchorEl.getBoundingClientRect();
  const pw = previewEl.offsetWidth;
  const ph = previewEl.offsetHeight;
  const GAP = 18;
  const PAD = 10;

  let left = r.left - pw - GAP;                       // preferred: to the left, over the board
  if (left < PAD) left = r.right + GAP;               // else: to the right
  if (left + pw > window.innerWidth - PAD) {          // last resort: clamp inside
    left = Math.max(PAD, window.innerWidth - pw - PAD);
  }

  let top = r.top + r.height / 2 - ph / 2;            // vertically centered on the card
  top = Math.max(PAD, Math.min(top, window.innerHeight - ph - PAD));

  previewEl.style.left = Math.round(left) + "px";
  previewEl.style.top  = Math.round(top)  + "px";

  // 4) fade in (only if this call is still the latest one)
  requestAnimationFrame(() => {
    if (token === previewToken) previewEl.style.opacity = "1";
  });
}

function hidePreview() {
  previewToken++;
  previewEl.style.display = "none";
  previewEl.style.opacity = "0";
  previewFrame.replaceChildren();
}

/* =========================================================
   5. RENDERING
   ========================================================= */

function updateHeaderScore(score) {
  headerScoreEl.textContent = formatScore(score);
  headerScoreEl.className   = "score-badge header-score " + scoreClass(score);
  evalFillEl.style.width    = (whiteShare(score) * 100).toFixed(1) + "%";
}

function renderHistory() {
  const frag = document.createDocumentFragment();

  const start = document.createElement("button");
  start.className = "hist-chip" + (path.length === 0 ? " current" : "");
  start.textContent = "Start";
  start.addEventListener("click", () => { path = []; render(); });
  frag.appendChild(start);

  path.forEach((mv, i) => {
    const chip = document.createElement("button");
    const moveNo = Math.floor(i / 2) + 1;
    const isWhiteMove = i % 2 === 0;
    chip.className = "hist-chip" + (i === path.length - 1 ? " current" : "");
    chip.textContent = (isWhiteMove ? moveNo + ". " : "") + mv.san;
    chip.addEventListener("click", () => { path = path.slice(0, i + 1); render(); });
    frag.appendChild(chip);
  });

  historyEl.replaceChildren(frag);
  historyEl.scrollTop = historyEl.scrollHeight;
}

/* ---------- move cards with mini board previews ---------- */
function renderMoves(node, board) {
  const count = node.children.length;
  moveCountEl.textContent = count ? count + (count === 1 ? " option" : " options") : "";

  if (!count) {
    const div = document.createElement("div");
    div.className = "empty";
    div.innerHTML = "End of this line.<br>Use <strong>← Back</strong> to try another option.";
    movesEl.replaceChildren(div);
    return;
  }

  const moveNo = Math.floor(path.length / 2) + 1;
  const whiteToMove = path.length % 2 === 0;

  const frag = document.createDocumentFragment();

  node.children.forEach((mv, i) => {
    // board position that WOULD result from this move
    const after = applyUci(board, mv.uci);

    const btn = document.createElement("button");
    btn.className = "move-btn";
    btn.style.animationDelay = (i * 22) + "ms";
    btn.setAttribute(
      "aria-label",
      mv.san + ", " + mv.next.label + ", " + formatScore(mv.next.score)
    );

    // 1) small board preview
    btn.appendChild(buildMiniBoard(after, mv.uci));

    // 2) text
    const main = document.createElement("span");
    main.className = "move-main";

    const sanRow = document.createElement("span");
    sanRow.className = "move-san-row";

    const num = document.createElement("span");
    num.className = "move-num";
    num.textContent = whiteToMove ? moveNo + "." : moveNo + "…";

    const san = document.createElement("span");
    san.className = "move-san";
    san.textContent = mv.san;

    sanRow.append(num, san);

    const label = document.createElement("span");
    label.className = "move-label";
    label.textContent = mv.next.label;

    main.append(sanRow, label);

    /* ---- score badge for the position after this move ---- */
    const badge = document.createElement("span");
    badge.className = "score-badge move-score " + scoreClass(mv.next.score);
    badge.textContent = formatScore(mv.next.score);

    btn.append(main, badge);

    // 4) behaviour
    btn.addEventListener("mouseenter", () => showPreview(btn, after, mv));
    btn.addEventListener("mouseleave", hidePreview);
    btn.addEventListener("focus",      () => showPreview(btn, after, mv));
    btn.addEventListener("blur",       hidePreview);

    btn.addEventListener("click", () => {
      hidePreview();
      path.push(mv);
      render();
    });

    frag.appendChild(btn);
  });

  movesEl.replaceChildren(frag);
  movesEl.scrollTop = 0;
}

/* ---------- master render ---------- */
function render() {
  hidePreview();

  const node     = currentNode();
  const board    = currentBoard();
  const lastMove = path.length ? path[path.length - 1] : null;

  renderBoard(board, lastMove);
  openingNameEl.textContent = node.label;
  updateHeaderScore(node.score);
  renderHistory();
  renderMoves(node, board);

  backBtn.disabled  = path.length === 0;
  resetBtn.disabled = path.length === 0;
}

/* ---------- controls ---------- */
backBtn.addEventListener("click", () => {
  if (path.length) { path.pop(); render(); }
});
resetBtn.addEventListener("click", () => {
  path = [];
  render();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" && path.length) { path.pop(); render(); }
  if (e.key === "Escape") hidePreview();
});

/* the floating preview must never be stale */
movesEl.addEventListener("scroll", hidePreview, { passive: true });
window.addEventListener("scroll", hidePreview, { passive: true });
window.addEventListener("resize", hidePreview);

/* ---------- go ---------- */
render();
</script>
</body>
</html>
